<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Briefing Room</title>
  <desc id="desc">A portable agent skill that turns messy context into a brief you can think with.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#08233F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#EAF3F5"/>
  <circle cx="1092" cy="72" r="118" fill="#D8F7FF"/>
  <circle cx="92" cy="594" r="104" fill="#D7EDF6" opacity="0.9"/>
  <rect x="64" y="54" width="1072" height="522" rx="32" fill="url(#panel)" stroke="#73E6FF" stroke-width="3"/>

  <text x="106" y="158" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="61" font-weight="750">THE BRIEFING ROOM</text>
  <line x1="106" y1="232" x2="1094" y2="232" stroke="#73E6FF" stroke-width="2" opacity="0.42"/>
  <text x="106" y="296" fill="#73E6FF" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750">TURN MESSY CONTEXT INTO</text>
  <text x="106" y="340" fill="#73E6FF" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750">A BRIEF YOU CAN THINK WITH.</text>
  <text x="106" y="398" fill="#D8F7FF" font-family="Inter, Arial, sans-serif" font-size="22">Facts. Claims. Assumptions. Tensions.</text>
  <text x="106" y="432" fill="#D8F7FF" font-family="Inter, Arial, sans-serif" font-size="22">Open questions. The next useful move.</text>
  <rect x="106" y="486" width="988" height="52" rx="26" fill="#73E6FF"/>
  <text x="600" y="519" fill="#08233F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.2">CLAUDE + CODEX  •  PORTABLE JUDGMENT SKILL</text>

  <g transform="translate(720 154)">
