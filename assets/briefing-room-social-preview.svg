    <rect x="126" y="156" width="84" height="28" rx="14" fill="#FFFFFF" opacity="0.18" stroke="#73E6FF" stroke-width="1"/>
    <rect x="224" y="156" width="98" height="28" rx="14" fill="#FFFFFF" opacity="0.18" stroke="#73E6FF" stroke-width="1"/>
    <line x1="34" y1="224" x2="346" y2="224" stroke="#73E6FF" stroke-width="2" opacity="0.72"/>
