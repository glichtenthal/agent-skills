<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Building Partner</title>
  <desc id="desc">A portable skill that helps people plan and build apps, prototypes, automations, and integrations with AI.</desc>
  <rect width="1200" height="630" fill="#F4F8F6"/>
  <rect x="64" y="64" width="1072" height="502" rx="30" fill="#FFFFFF" stroke="#B9DED4" stroke-width="3"/>

  <g transform="translate(112 112)">
    <rect width="126" height="126" rx="28" fill="#DDF4ED"/>
    <rect x="24" y="25" width="54" height="62" rx="11" fill="#102033"/>
    <rect x="49" y="42" width="54" height="62" rx="11" fill="#48B89D"/>
    <circle cx="64" cy="65" r="20" fill="#FFFFFF" stroke="#102033" stroke-width="4"/>
    <path d="M54 65l7 7 14-16" fill="none" stroke="#0B6B5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="280" y="166" fill="#102033" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700">BUILDING PARTNER</text>
  <text x="280" y="226" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="30">For apps, prototypes, automations, and integrations</text>

  <line x1="112" y1="310" x2="1088" y2="310" stroke="#D7E7E1" stroke-width="2"/>
  <text x="112" y="384" fill="#102033" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">Describe what you want to build in ordinary language.</text>
  <text x="112" y="438" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="28">Building Partner helps the AI explain consequential choices, ask before risky actions,</text>
  <text x="112" y="480" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="28">and verify the result against the real use case.</text>
</svg>
