<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Judgment Infrastructure for Human-Led AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E2F63"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="48" y="48" width="1184" height="544" rx="26" fill="none" stroke="#9EE7FF" stroke-width="2" opacity="0.35"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="130" fill="#9EE7FF" font-size="20" font-weight="700" letter-spacing="3">PORTABLE AGENT SKILLS</text>
