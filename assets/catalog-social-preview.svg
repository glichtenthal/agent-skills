    <rect x="720" y="388" width="464" height="184" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#7FD3B6" stroke-width="2"/>
    <rect x="740" y="388" width="424" height="6" rx="3" fill="#4FBF9A"/>
    <text x="748" y="436" fill="#9FE3CB" font-size="18" font-weight="700" letter-spacing="2">BUILD</text>
