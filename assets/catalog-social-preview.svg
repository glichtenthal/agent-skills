    <rect x="96" y="520" width="360" height="40" rx="20" fill="#FFFFFF"/>
    <text x="120" y="547" fill="#0B1F3A" font-size="20" font-weight="800">Claude + Codex agent skills</text>

    <rect x="720" y="96" width="464" height="268" rx="20" fill="#FFFFFF" fill-opacity="0.1" stroke="#73B2FF" stroke-width="2"/>
    <rect x="740" y="96" width="424" height="6" rx="3" fill="#4C9BFF"/>
    <text x="748" y="146" fill="#9CC9FF" font-size="18" font-weight="700" letter-spacing="2">THINK AND DECIDE</text>
