  <desc id="desc">A portable skill that stewards human-led AI project builds through visible choices, approval boundaries, recorded decisions, and verified results.</desc>
  <rect width="1200" height="630" fill="#F4F8F6"/>
  <rect x="64" y="64" width="1072" height="502" rx="30" fill="#FFFFFF" stroke="#B9DED4" stroke-width="3"/>

  <g transform="translate(112 112)">
    <rect width="126" height="126" rx="28" fill="#DDF4ED"/>
    <rect x="24" y="25" width="54" height="62" rx="11" fill="#102033"/>
    <rect x="49" y="42" width="54" height="62" rx="11" fill="#48B89D"/>
    <circle cx="64" cy="65" r="20" fill="#FFFFFF" stroke="#102033" stroke-width="4"/>
    <path d="M54 65l7 7 14-16" fill="none" stroke="#0B6B5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="280" y="166" fill="#102033" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">AI PROJECT STEWARD</text>
